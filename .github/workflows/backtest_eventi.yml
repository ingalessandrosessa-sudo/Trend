name: Backtest appuntamenti

on:
  workflow_dispatch:        # si avvia solo a mano dal pulsante "Run workflow"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Verifica le regole sugli appuntamenti
        run: python backtest_eventi.py

      - name: Salva i risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898339+github-actions[bot]@users.noreply.github.com"
          git add docs/dati/backtest_eventi*
          git diff --staged --quiet || git commit -m "Backtest appuntamenti $(date -u +'%F %H:%M')"
          git pull --rebase
          git push
