name: Aggiorna segnali

on:
  schedule:
    - cron: "15 5 * * *"   # ogni giorno alle 05:15 UTC (07:15 ora legale, 06:15 ora solare)
  workflow_dispatch:        # permette l'avvio manuale dal pulsante "Run workflow"

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Esegui ricerca e segnali
        run: python trend_knockout.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGINA_URL: ${{ vars.PAGINA_URL }}

      - name: Pubblica la pagina aggiornata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898339+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Aggiornamento $(date -u +%F)"
          git push
